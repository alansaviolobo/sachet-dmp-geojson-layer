name: Update Sachet Data

on:
  schedule:
    - cron: '0 * * * *'   # Run every hour
  workflow_dispatch:      # Allow manual trigger
  repository_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Need write permission to update the cached file
    
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch and process API data
        run: npm start

      - name: Save Data to Temp
        run: |
          mkdir -p /tmp/sachet_data
          cp data/*.geojson /tmp/sachet_data/
          cp data/debug-log.txt /tmp/sachet_data/ || true

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Commit and push changes
        run: |
          # Restore data
          mkdir -p data
          cp /tmp/sachet_data/*.geojson data/
          cp /tmp/sachet_data/debug-log.txt data/ || true

          # Configure Git
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Commit
          if git status -s | grep -q "data/"; then
            git add data/*.geojson
            git add data/debug-log.txt
            git commit -m "Refresh alerts data"
            git push
          else
            echo "No changes detected in data files"
          fi 